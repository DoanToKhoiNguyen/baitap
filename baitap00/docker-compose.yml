services:
  # 1. Service Database (Bắt buộc phải đặt tên service là mongodb)
  mongodb:
    image: mongo:latest
    container_name: mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  # 2. Service Node.js App
  baitap00:
    build: .
    container_name: baitap00-container
    ports:
      - "3000:3000"
    command: npm run dev
    volumes: 
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/gs25_db
    depends_on:
      - mongodb
    restart: always

volumes:
  mongo-data: